services:

  # ==================== Hadoop ====================
  hadoop-namenode:
    image: apache/hadoop:3.3.6
    platform: linux/amd64
    container_name: hadoop-namenode
    hostname: namenode
    environment:
      - HADOOP_HOME=/opt/hadoop
    ports:
      - "9870:9870"   # Web UI
      - "9872:9000"   # RPC
    volumes:
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command: >
      bash -c "
      if [ ! -d /opt/hadoop/data/namenode/current ]; then
        echo 'Formatting namenode...';
        hdfs namenode -format -force;
      fi;
      exec hdfs namenode
      "

  hadoop-datanode:
    image: apache/hadoop:3.3.6
    platform: linux/amd64
    container_name: hadoop-datanode
    hostname: hadoop-datanode
    environment:
      - HADOOP_HOME=/opt/hadoop
    ports:
      - "9864:9864"   # Web UI
      - "9866:9866"   # Data transfer
    volumes:
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command: ["hdfs", "datanode"]

  # ==================== Zookeeper + Kafka ====================
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
    ports:
      - "9092:9092"
      - "9094:9094"

  # ==================== Postgres + Hive ====================
  postgres:
    image: postgres:13
    restart: unless-stopped
    container_name: hive-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5432:5432"
    volumes:
      - hive_db:/var/lib/postgresql/data

  metastore:
    build:
      context: .
      dockerfile: Dockerfile.hive-metastore
    restart: unless-stopped
    container_name: hive-metastore
    hostname: metastore
    depends_on:
      - postgres
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Xmx1G
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse
        -Dhive.metastore.warehouse.managed.dir=hdfs://namenode:9000/user/hive/warehouse
    ports:
      - "9083:9083"
    volumes:
      - warehouse:/opt/hive/data/warehouse

  hiveserver2:
    image: apache/hive:4.0.0
    restart: unless-stopped
    container_name: hive-server2
    depends_on:
      - metastore
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Xmx1G
        -Dhive.metastore.uris=thrift://metastore:9083
        -Dhive.metastore.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse
        -Dhive.metastore.warehouse.managed.dir=hdfs://namenode:9000/user/hive/warehouse
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - warehouse:/opt/hive/data/warehouse
      - ./hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hive-conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro

  # ==================== Flink ====================
  flink-jobmanager:
    image: flink:1.17.1
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    ports:
      - "8881:8081"   # Flink Web UI
    volumes:
      - ./flink-lib:/opt/flink/hadoop-lib:rw
      - ./hadoop-conf:/opt/flink/hadoop-conf:rw
      - ./jars:/opt/flink/usrlib:rw
      - ./jobs:/opt/flink/jobs:rw
    entrypoint: >
      bash -c "cp /opt/flink/hadoop-lib/*.jar /opt/flink/lib/ 2>/dev/null;
      exec /docker-entrypoint.sh jobmanager"

  flink-taskmanager:
    image: flink:1.17.1
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    volumes:
      - ./flink-lib:/opt/flink/hadoop-lib:rw
      - ./hadoop-conf:/opt/flink/hadoop-conf:rw
      - ./jars:/opt/flink/usrlib:rw
      - ./jobs:/opt/flink/jobs:rw
    entrypoint: >
      bash -c "cp /opt/flink/hadoop-lib/*.jar /opt/flink/lib/ 2>/dev/null;
      exec /docker-entrypoint.sh taskmanager"

volumes:
  hive_db:
  warehouse:
  namenode_data:
  datanode_data: